<!doctype html>
<html lang="en" data-theme="red-retro">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' dkfm: https: data: blob:; media-src 'self' dkfm: blob:; font-src 'self'; connect-src 'self' dkfm:">
  <title>DK.FM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="titlebar">
    <div class="tb-left">
      <div class="logo"><span class="logo-dk">DK</span><span class="logo-dot">.</span><span class="logo-fm">FM</span></div>
      <nav class="tb-menu">
        <button class="tb-btn" id="btn-layout" title="Edit layout (Ctrl+E)">LAYOUT</button>
        <div class="dropdown">
          <button class="tb-btn" id="btn-panels">PANELS</button>
          <div class="dropdown-menu" id="panels-menu"></div>
        </div>
        <div class="dropdown">
          <button class="tb-btn" id="btn-theme">THEME</button>
          <div class="dropdown-menu" id="theme-menu"></div>
        </div>
        <button class="tb-btn" id="btn-settings" title="Settings (Ctrl+,)">SETTINGS</button>
      </nav>
    </div>
    <div class="tb-center" id="tb-status"></div>
    <div class="tb-right">
      <button class="tb-btn update-pill hidden" id="btn-update"></button>
      <button class="tb-btn" id="btn-mini" title="Mini player (Ctrl+M)">MINI</button>
      <div class="win-ctrls" id="win-ctrls">
        <button class="win-btn" data-act="minimize" title="Minimize"><svg viewBox="0 0 10 10"><rect x="1" y="7" width="8" height="2"/></svg></button>
        <button class="win-btn" data-act="maximize" title="Maximize"><svg viewBox="0 0 10 10"><path d="M1 1h8v8H1z M2 3v5h6V3z" fill-rule="evenodd"/></svg></button>
        <button class="win-btn close" data-act="close" title="Close"><svg viewBox="0 0 10 10"><path d="M1 1h2v2H1zM3 3h2v2H3zM5 5h2v2H5zM7 7h2v2H7zM7 1h2v2H7zM5 3h2v2H5zM3 5h2v2H3zM1 7h2v2H1z"/></svg></button>
      </div>
    </div>
  </header>

  <main id="workspace"></main>

  <!-- Panel templates; layout.js moves them into columns. -->
  <div id="panel-store" hidden>
    <section class="panel" data-panel="deck" data-title="DECK">
      <div class="deck">
        <div class="deck-top">
          <div class="cover-wrap"><img id="np-cover" class="cover" alt=""><div class="cover-ph" id="np-cover-ph"></div></div>
          <div class="lcd">
            <div class="lcd-row lcd-status"><span id="np-state">STOP</span><span id="np-tech">--- KBPS · -- KHZ</span></div>
            <div class="lcd-time"><span id="np-elapsed">00:00</span><span class="lcd-slash">/</span><span id="np-total">00:00</span></div>
            <div class="marquee"><span id="np-title">NO TRACK LOADED</span></div>
            <div class="lcd-row lcd-sub"><span id="np-artist">INSERT A TAPE</span></div>
            <div class="lcd-row lcd-sub dim"><span id="np-album"></span></div>
          </div>
        </div>
        <div class="seek" id="seek">
          <canvas id="wave"></canvas>
          <div class="seek-hover" id="seek-hover"></div>
        </div>
        <div class="transport">
          <button class="tbtn small" id="tp-shuffle" title="Shuffle (S)">SHUF</button>
          <button class="tbtn" id="tp-prev" title="Previous (Ctrl+←)"><svg viewBox="0 0 16 16"><path d="M2 2h2v12H2zM14 2v12L5 8z"/></svg></button>
          <button class="tbtn play" id="tp-play" title="Play/Pause (Space)"><svg class="i-play" viewBox="0 0 16 16"><path d="M3 1l12 7-12 7z"/></svg><svg class="i-pause" viewBox="0 0 16 16"><path d="M3 1h4v14H3zM9 1h4v14H9z"/></svg></button>
          <button class="tbtn" id="tp-next" title="Next (Ctrl+→)"><svg viewBox="0 0 16 16"><path d="M12 2h2v12h-2zM2 2v12l9-6z"/></svg></button>
          <button class="tbtn small" id="tp-repeat" title="Repeat (R)">RPT</button>
        </div>
        <div class="deck-bottom">
          <button class="icon-btn" id="tp-like" title="Like (L)">♥</button>
          <button class="icon-btn" id="tp-mute" title="Mute (M)"><svg viewBox="0 0 16 16"><path d="M1 5h3l4-4v14l-4-4H1z"/><path class="vol-w" d="M10 5h1v6h-1zM12 3h1v10h-1z"/></svg></button>
          <input type="range" class="pixel-range" id="tp-volume" min="0" max="1" step="0.01">
          <span class="vol-readout" id="tp-vol-readout">80</span>
          <button class="icon-btn txt" id="tp-speed" title="Playback speed">1.0×</button>
          <button class="icon-btn txt" id="tp-sleep" title="Sleep timer">ZZ</button>
        </div>
      </div>
    </section>

    <section class="panel" data-panel="scope" data-title="SCOPE">
      <div class="scope">
        <canvas id="scope-canvas"></canvas>
        <div class="scope-modes" id="scope-modes"></div>
      </div>
    </section>

    <section class="panel" data-panel="browser" data-title="LIBRARY">
      <div class="browser">
        <aside class="sources" id="sources"></aside>
        <div class="view" id="view"></div>
      </div>
    </section>

    <section class="panel" data-panel="queue" data-title="QUEUE">
      <div class="queue">
        <div class="queue-head">
          <span id="queue-info">0 TRACKS</span>
          <div class="spacer"></div>
          <button class="mini-btn" id="queue-save" title="Save queue as playlist">SAVE</button>
          <button class="mini-btn" id="queue-clear" title="Clear upcoming">CLEAR</button>
        </div>
        <ol class="queue-list" id="queue-list"></ol>
      </div>
    </section>

    <section class="panel" data-panel="eq" data-title="EQUALIZER">
      <div class="eq">
        <div class="eq-head">
          <label class="switch"><input type="checkbox" id="eq-on"><span></span>EQ</label>
          <select id="eq-preset" class="pixel-select"></select>
          <button class="mini-btn" id="eq-reset">RESET</button>
        </div>
        <canvas id="eq-curve"></canvas>
        <div class="eq-bands" id="eq-bands"></div>
        <div class="eq-extra">
          <label>X-FADE <input type="range" class="pixel-range" id="opt-crossfade" min="0" max="12" step="1"><b id="opt-crossfade-v">0s</b></label>
          <label class="switch"><input type="checkbox" id="opt-normalize"><span></span>LEVELER</label>
        </div>
      </div>
    </section>

    <section class="panel" data-panel="lyrics" data-title="LYRICS">
      <div class="lyrics" id="lyrics"><div class="empty">NO LYRICS</div></div>
    </section>
  </div>

  <div id="ctx-menu" class="ctx-menu hidden"></div>
  <div id="toasts"></div>
  <div id="modal-root"></div>
  <div id="drop-overlay" class="hidden"><div>DROP AUDIO FILES TO ADD</div></div>
  <div class="crt-overlay"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
