# Builds DK.FM for Windows / macOS / Linux on every push.
# Pushes to main also publish a GitHub Release (v2.0.<run number>); installed copies of DK.FM
# check these releases and update themselves. Other branches only build (a dry run).
name: Release

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: 2.0.${{ github.run_number }}
  CARGO_TERM_COLOR: always

jobs:
  # the tests on every OS; a release is only published when they pass
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
          - os: ubuntu-22.04 # older glibc, so the Linux build runs on more distros
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set version
        run: perl -0pi -e 's/^version = "[^"]*"/version = "'"$VERSION"'"/m' Cargo.toml && grep -m1 '^version' Cargo.toml

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package (Windows)
        if: matrix.name == 'windows'
        run: |
          mkdir -p out
          # the same exe twice: "-setup" installs itself (and moves Electron-era installs over),
          # the plain one is what DK.FM's own updater downloads
          cp target/release/dkfm.exe "out/DK.FM-$VERSION-windows-x64.exe"
          cp target/release/dkfm.exe "out/DK.FM-$VERSION-windows-x64-setup.exe"
          bash scripts/update-manifest.sh latest.yml "out/DK.FM-$VERSION-windows-x64-setup.exe"

      - name: Package (macOS)
        if: matrix.name == 'mac'
        run: |
          mkdir -p out DK.FM.app/Contents/MacOS DK.FM.app/Contents/Resources icon.iconset
          cp target/release/dkfm DK.FM.app/Contents/MacOS/DK.FM
          for s in 16 32 128 256 512; do
            sips -z $s $s docs/logo.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) docs/logo.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o DK.FM.app/Contents/Resources/AppIcon.icns
          cat > DK.FM.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>DK.FM</string>
            <key>CFBundleDisplayName</key><string>DK.FM</string>
            <key>CFBundleIdentifier</key><string>com.thatdanyal.dkfm</string>
            <key>CFBundleExecutable</key><string>DK.FM</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.music</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>SHAZAM listens through the microphone to name a song playing around you.</string>
          </dict></plist>
          EOF
          codesign --force --deep -s - DK.FM.app   # ad-hoc signature (Apple Silicon won't run unsigned code)
          ditto -c -k --keepParent DK.FM.app "out/DK.FM-$VERSION-mac-arm64.zip"
          hdiutil create -volname DK.FM -srcfolder DK.FM.app -ov -format UDZO "out/DK.FM-$VERSION-mac-arm64.dmg"

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          mkdir -p out
          convert_icon() { python3 -c "import sys; from PIL import Image; Image.open('docs/logo.png').resize((256,256)).save(sys.argv[1])" "$1"; }
          pip3 install --quiet pillow

          # AppImage (self-updating)
          mkdir -p AppDir/usr/bin
          cp target/release/dkfm AppDir/usr/bin/dk-fm
          convert_icon AppDir/dk-fm.png
          printf '[Desktop Entry]\nName=DK.FM\nComment=Retro desktop music player\nExec=dk-fm\nIcon=dk-fm\nType=Application\nCategories=AudioVideo;Audio;Player;\n' > AppDir/dk-fm.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/dk-fm" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir "out/DK.FM-$VERSION-linux-x86_64.AppImage"

          # .deb (same package name as the Electron version, so it upgrades in place)
          P=deb; mkdir -p $P/DEBIAN $P/opt/DK.FM $P/usr/share/applications $P/usr/share/icons/hicolor/256x256/apps
          cp target/release/dkfm $P/opt/DK.FM/dk-fm
          convert_icon $P/usr/share/icons/hicolor/256x256/apps/dk-fm.png
          printf '[Desktop Entry]\nName=DK.FM\nComment=Retro desktop music player\nExec=/opt/DK.FM/dk-fm %%U\nIcon=dk-fm\nType=Application\nCategories=AudioVideo;Audio;Player;\n' > $P/usr/share/applications/dk-fm.desktop
          cat > $P/DEBIAN/control <<EOF
          Package: dk-fm
          Version: $VERSION
          Architecture: amd64
          Maintainer: thatdanyal <thatdanyal@users.noreply.github.com>
          Depends: libasound2 | libasound2t64, libgtk-3-0 | libgtk-3-0t64, libxkbcommon-x11-0
          Section: sound
          Priority: optional
          Homepage: https://github.com/thatdanyal/dk-fm
          Description: Retro desktop music player
          EOF
          sed -i 's/^          //' $P/DEBIAN/control
          printf '#!/bin/sh\nln -sf /opt/DK.FM/dk-fm /usr/bin/dk-fm\n' > $P/DEBIAN/postinst
          printf '#!/bin/sh\nif [ "$1" = remove ] || [ "$1" = purge ]; then rm -f /usr/bin/dk-fm; fi\n' > $P/DEBIAN/postrm
          chmod 755 $P/DEBIAN/postinst $P/DEBIAN/postrm
          dpkg-deb --build --root-owner-group $P "out/DK.FM-$VERSION-linux-amd64.deb"

          bash scripts/update-manifest.sh latest-linux.yml "out/DK.FM-$VERSION-linux-x86_64.AppImage" "out/DK.FM-$VERSION-linux-amd64.deb"

      - name: Sizes
        run: ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dkfm-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # "What's new" shown in the in-app update popup = commit subjects since the last release.
      - name: Write release notes
        run: |
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          RANGE=$([ -n "$PREV" ] && echo "$PREV..HEAD" || echo "HEAD")
          git log $RANGE --no-merges --pretty=format:'- %s' | grep -v '^- Merge' | head -n 30 > notes.md || true
          [ -s notes.md ] || echo "- Maintenance update" > notes.md
          cat notes.md

      - name: Publish v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release create "v$VERSION" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DK.FM v$VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md
