[package]
name = "dkfm"
version = "2.0.0"
edition = "2021"
rust-version = "1.87"
description = "DK.FM — retro desktop music player"
authors = ["thatdanyal"]
license = "MIT"
repository = "https://github.com/thatdanyal/dk-fm"

[[bin]]
name = "dkfm"
path = "src/main.rs"

[dependencies]
# UI: immediate-mode GUI on OpenGL (redraws only when something changes)
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland"] }
egui_dock = { version = "0.16", features = ["serde"] }
ab_glyph = "0.2" # (already used by egui) checks system fonts cover an alphabet
memmap2 = "0.9"

# audio
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "adpcm", "alac"] }
cpal = "0.15"
rubato = { version = "0.15", default-features = false }
rtrb = "0.3"

# library / files
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
walkdir = "2"
notify = "6"
sha1 = "0.10"
sha2 = "0.10"

# data / net / misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
urlencoding = "2"
crossbeam-channel = "0.5"
parking_lot = "0.12"
fastrand = "2"
dirs = "5"
open = "5"
rfd = "0.15"
auto-launch = "0.5"
raw-window-handle = "0.6"
souvlaki = { version = "0.7", default-features = false, features = ["use_zbus"] }
unicode-normalization = "0.1"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com"] }

# voice search: Windows' own speech recognition (the same crate version egui's deps already build)
windows = { version = "0.58", default-features = false, features = ["Foundation", "Foundation_Collections", "Media_SpeechRecognition"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.clippy]
# style choices of this codebase: UI helpers take many arguments, DSP loops index several buffers
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"

[profile.release]
# optimize for size ("z": 1.6 MB smaller than "s"; frames ~0.25 ms slower, CPU while playing the
# same); the audio decoders and resampler stay at full speed below (import + analysis speed)
opt-level = "z"
lto = "fat"
codegen-units = 1
# unwind: a panic in a background thread (media keys, a damaged music file, a download) stops
# only that thread, not the whole app
panic = "unwind"
strip = true

[profile.release.package]
symphonia-core.opt-level = 3
symphonia-bundle-mp3.opt-level = 3
symphonia-codec-aac.opt-level = 3
symphonia-bundle-flac.opt-level = 3
symphonia-codec-vorbis.opt-level = 3
rubato.opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# eframe 0.31.1 with one fix (see vendor/eframe/DKFM-PATCH.md): a hidden window (DK.FM in the
# tray) no longer spins the event loop at 100% of a CPU core
[patch.crates-io]
eframe = { path = "vendor/eframe" }
